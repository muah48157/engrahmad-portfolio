<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <defs>
    <linearGradient id="utrack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="utrack-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow-utrack" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- App Icon Squircle -->
  <rect width="80" height="80" rx="18" fill="url(#utrack-bg)" />
  <rect x="1" y="1" width="78" height="78" rx="17" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  
  <!-- GPS Radar & Route Navigator -->
  <g filter="url(#glow-utrack)">
    <!-- Radar Rings -->
    <circle cx="40" cy="40" r="22" stroke="rgba(96,165,250,0.25)" stroke-width="2" stroke-dasharray="3 3" />
    <circle cx="40" cy="40" r="14" stroke="rgba(56,189,248,0.4)" stroke-width="1.5" />
    <!-- Navigation Arrow -->
    <path d="M40 24L52 52L40 45L28 52L40 24Z" fill="url(#utrack-accent)" />
    <!-- Pulse Center Point -->
    <circle cx="40" cy="40" r="2.5" fill="#ffffff" />
  </g>
</svg>
